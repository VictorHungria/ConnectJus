<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ConnectJus Docs. — em manutenção</title>
  <meta name="description" content="O ConnectJus Docs. está em manutenção enquanto preparamos a nova versão.">
  <link rel="icon" href="/marca.svg" type="image/svg+xml">
  <style>
    :root { --texto: #333; --texto-2: #666; --texto-3: #8f8f8f; --linha: #e6e6e6; --marca: #1f1f1f; --fonte: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #fff; color: var(--texto); font: 16px/1.6 var(--fonte); display: grid; place-items: center; padding: 24px 16px; -webkit-font-smoothing: antialiased; }
    main { max-width: 460px; text-align: center; }
    .marca { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 40px; color: var(--marca); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
    .marca img { width: 52px; height: auto; }
    h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.25; color: var(--marca); letter-spacing: -0.01em; }
    p { margin: 0 0 12px; color: var(--texto-2); }
    footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--linha); font-size: 13px; color: var(--texto-3); }
  </style>
</head>
<body>
  <main>
    <div class="marca"><img src="/marca.svg" alt=""><span>ConnectJus Docs.</span></div>
    <h1>Estamos preparando a nova versão</h1>
    <p>O site está em manutenção enquanto terminamos o novo ConnectJus Docs.: o escritório que conversa com você, escreve as peças no seu estilo e guarda tudo no seu computador.</p>
    <p>Volte em breve.</p>
    <footer>ConnectJus Docs.</footer>
  </main>
</body>
</html>
