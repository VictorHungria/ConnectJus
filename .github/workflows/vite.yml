# Publica o aviso de manutenção no GitHub Pages (o site novo fica no Firebase Hosting; o antigo, no ramo site-antigo)
name: Deploy static content to Pages

on:
  # Roda em pushes para a branch principal
  push:
    branches: ["main"] # Mude para 'master' se sua branch principal for 'master'

  # Permite que você rode esse workflow manualmente pela aba Actions
  workflow_dispatch:

# Define permissões do GITHUB_TOKEN para permitir o deploy no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy concorrente
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job único de deploy
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Em manutenção: publica só o aviso (o site antigo está no ramo site-antigo).
          path: './manutencao'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
